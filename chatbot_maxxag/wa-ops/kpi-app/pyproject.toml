[project]
name = "wa-ops-kpi"
version = "0.1.0"
description = "WhatsApp Ops KPI dashboard + Claude analyzer"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",   # form data for login
    # Database
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "sqlalchemy[asyncio]>=2.0.30",  # for alembic + query helpers
    "psycopg[binary]>=3.2.0",     # sync driver for alembic migrations
    # Redis + queues
    "redis>=5.0.0",
    "arq>=0.26.0",
    # Auth
    "bcrypt>=4.2.0",
    "pyjwt[crypto]>=2.9.0",
    # Claude — 0.44+ for output_config.format + auto-strip of unsupported JSON schema constraints
    "anthropic>=0.44.0",
    # Config
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # Utils
    "httpx>=0.27.0",              # for Chatwoot/Evolution API calls if needed
    "python-dateutil>=2.9.0",
    # Reports
    "python-docx>=1.1.0",         # DOCX export for conversation analysis
    # Observability
    "structlog>=24.0.0",          # JSON structured logging + request_id context
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
