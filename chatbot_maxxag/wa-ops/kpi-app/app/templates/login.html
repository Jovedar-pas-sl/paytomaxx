{% extends "base.html" %}
{% block title %}Login — Maxxag Ops{% endblock %}

{% block content %}
<div class="flex min-h-[calc(100vh-4rem)] items-center justify-center px-4">
  <form method="post" action="/login"
        class="w-full max-w-sm space-y-6 rounded-2xl border border-border bg-surface p-8 shadow-card">
    <div class="text-center">
      <div class="mb-4 flex items-center justify-center gap-2.5">
        <img src="/static/img/lips.png" alt="Maxxag"
             class="h-10 w-10 object-contain drop-shadow-[0_1px_6px_rgba(244,63,94,0.5)]">
        <span class="text-left leading-tight">
          <span class="block text-[17px] font-bold text-text">Maxxag</span>
          <span class="-mt-0.5 block text-[11px] font-medium text-muted-2">Operaciones</span>
        </span>
      </div>
      <p class="text-xs text-muted">Panel solo-admin</p>
    </div>

    {% if error %}
    <div class="rounded-lg border border-red/40 bg-red/10 px-3 py-2 text-sm text-red">
      {{ error }}
    </div>
    {% endif %}

    <label class="block space-y-1.5">
      <span class="text-[12px] font-semibold uppercase tracking-wide text-muted-2">Email</span>
      <input type="email" name="email" required autocomplete="username"
             class="block w-full rounded-lg border border-border bg-surface-2 px-3 py-2 text-sm text-text placeholder:text-muted-2 outline-none transition-colors focus:border-accent"
             placeholder="sales@nouesmalt.com">
    </label>

    <label class="block space-y-1.5">
      <span class="text-[12px] font-semibold uppercase tracking-wide text-muted-2">Contraseña</span>
      <input type="password" name="password" required autocomplete="current-password"
             class="block w-full rounded-lg border border-border bg-surface-2 px-3 py-2 text-sm text-text placeholder:text-muted-2 outline-none transition-colors focus:border-accent">
    </label>

    <button type="submit"
            class="flex w-full items-center justify-center rounded-lg bg-accent px-4 py-2 text-sm font-semibold text-bg transition-colors hover:bg-accent/90">
      Entrar
    </button>
  </form>
</div>
{% endblock %}
