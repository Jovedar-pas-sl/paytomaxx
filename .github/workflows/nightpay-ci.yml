# Comprobaciones de OxioPay (nightpay/) en cada push a main, fix/** y feat/**
# y en cada PR (a cualquier rama):
#   check       tipos de las 5 apps, tests del API (con cobertura mínima), del
#               cliente común, del operador y del panel, y vulnerabilidades críticas/altas (scripts/audit-gate.mjs;
#               además cada día en nightpay-audit.yml: un aviso nuevo no espera al próximo push)
#   lint        ESLint de la raíz; de momento NO bloquea (hay avisos viejos)
#   integracion migraciones en un Postgres 16 vacío con un rol SIN superusuario
#               (FORCE RLS de verdad), esquema = schema.prisma, las pruebas
#               de integración del API contra esa base y la prueba de
#               restauración (una copia completa pasa, una incompleta no)
#   e2e         navegador (Playwright) con login real contra API y webs
#               levantados en el job, base y Redis aislados
#   docker      reglas de alertas (promtool) y las 5 imágenes que despliega
#               Dokploy, construidas y arrancadas
#   migraciones-orden  cada migración nueva se ordena después de la última de
#               main (si no, una base nueva y producción las aplicarían en otro orden)
#               y, desde 20261029, la que toma candados empieza con SET lock_timeout
#
# Las acciones de terceros van fijadas por commit (el comentario dice la versión).
name: nightpay-ci

on:
  push:
    branches: [main, 'fix/**', 'feat/**']
    paths:
      - 'nightpay/**'
      - 'package.json'
      - 'nightpay/pnpm-workspace.yaml'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'nightpay/**'
      - 'package.json'
      - 'nightpay/pnpm-workspace.yaml'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

# En las ramas, un push nuevo cancela el CI del anterior. En main no: cada
# commit de main tiene que tener su CI completo (se despliega tras el verde,
# docs/DOKPLOY-STEPS.md D.1).
concurrency:
  group: nightpay-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: nightpay

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # La versión de pnpm la fija "packageManager" del package.json de la raíz.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: nightpay/.nvmrc
          cache: pnpm
          cache-dependency-path: nightpay/pnpm-lock.yaml
      - name: Dependencias
        run: pnpm install --frozen-lockfile
      - name: Cliente de Prisma
        run: pnpm --filter @nightpay/db exec prisma generate
      - name: Identidad automática del código construido
        run: node --test scripts/build-info.test.mjs
      - name: El corte por vulnerabilidades corta de verdad (alta/crítica sin aceptar o caducada → rojo)
        run: node --test scripts/audit-gate.test.mjs
      - name: Las migraciones nuevas con candados llevan SET lock_timeout (las reglas de check-migration-order)
        run: node --test scripts/check-migration-order.test.mjs
      - name: Tipos (las 5 apps y el cliente común del API)
        run: |
          for app in apps/api apps/admin apps/operator apps/tpv apps/web-client packages/api-client; do
            echo "::group::$app"
            (cd $app && npx tsc --noEmit -p .) || exit 1
            echo "::endgroup::"
          done
      - name: Tests del API (con cobertura mínima, ver vitest.config.ts)
        working-directory: nightpay/apps/api
        run: pnpm test:coverage
      - name: Tests del cliente común del API (sesión con cookie)
        working-directory: nightpay/packages/api-client
        run: npx vitest run
      - name: Tests del operador
        working-directory: nightpay/apps/operator
        run: npx vitest run
      - name: Tests del panel
        working-directory: nightpay/apps/admin
        run: npx vitest run
      - name: Vulnerabilidades críticas/altas (aceptadas solo las de .audit-allowlist.json)
        run: node scripts/audit-gate.mjs
      - name: Informe de cobertura
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cobertura-api
          path: nightpay/apps/api/coverage/
          retention-days: 14
          if-no-files-found: ignore

  # Prisma aplica las migraciones por orden de nombre: una nueva con fecha
  # anterior a la última de main se aplicaría en producción después de las que
  # ya tiene y en una base nueva antes. Historial completo para el merge-base
  # con origin/main.
  migraciones-orden:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Migraciones nuevas después de la última de main y con SET lock_timeout
        run: node scripts/check-migration-order.mjs

  # ESLint de la raíz sobre apps/** y packages/**. Hay ~100 avisos antiguos
  # (se limpian en la fase 2): el job puede salir en rojo pero no bloquea.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: nightpay/.nvmrc
          cache: pnpm
          cache-dependency-path: nightpay/pnpm-lock.yaml
      - name: Dependencias
        run: pnpm install --frozen-lockfile
      - name: ESLint (raíz)
        run: pnpm lint:root

  # Base de datos de verdad. El rol np_app NO es superusuario y es el dueño de
  # la base: así Postgres le aplica FORCE ROW LEVEL SECURITY (a un superusuario
  # no). Migraciones y pruebas corren como np_app.
  integracion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://np_app:np_app@localhost:5432/nightpay
      SHADOW_DATABASE_URL: postgresql://np_app:np_app@localhost:5432/nightpay_shadow
      # Solo para las pruebas (40 caracteres, no es ningún secreto real).
      ENCRYPTION_KEK: ci-kek-solo-para-pruebas-0123456789abcde
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: nightpay/.nvmrc
          cache: pnpm
          cache-dependency-path: nightpay/pnpm-lock.yaml
      - name: Dependencias
        run: pnpm install --frozen-lockfile
      - name: Cliente de Prisma
        run: pnpm --filter @nightpay/db exec prisma generate
      - name: Rol np_app (sin superusuario), dueño de nightpay y de la base sombra
        run: |
          psql() { docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U postgres -d postgres "$@"; }
          psql -c "CREATE ROLE np_app LOGIN PASSWORD 'np_app' NOSUPERUSER NOCREATEDB NOCREATEROLE"
          psql -c "CREATE DATABASE nightpay OWNER np_app"
          psql -c "CREATE DATABASE nightpay_shadow OWNER np_app"
          psql -tAc "SELECT 'np_app superusuario: ' || rolsuper FROM pg_roles WHERE rolname = 'np_app'"
      - name: Esquema sin drift (migraciones en una base vacía = schema.prisma)
        working-directory: nightpay/packages/db
        run: node scripts/check-drift.mjs --shadow-database-url "$SHADOW_DATABASE_URL"
      - name: Migraciones como en el arranque del API (db-heal → migrate deploy → db-heal)
        working-directory: nightpay/packages/db
        run: |
          ./node_modules/.bin/tsx scripts/db-heal.ts
          ./node_modules/.bin/prisma migrate deploy
          ./node_modules/.bin/tsx scripts/db-heal.ts
          node scripts/check-drift.mjs --from-url "$DATABASE_URL"
      - name: Pruebas de integración del API (Postgres real, RLS forzado)
        working-directory: nightpay/apps/api
        run: pnpm test:integration
      # La base que dejaron las pruebas de integración, copiada con pg_dump -Fc y
      # restaurada en un Postgres de usar y tirar (scripts/restore-check.sh): la
      # completa tiene que pasar (esquema, migraciones, coherencia del dinero);
      # una sin post-data (sin índices ni restricciones) tiene que fallar, y por eso.
      - name: Restauración real completa e incompleta, siempre en bases desechables
        env:
          MIN_PAYMENTS: '0'
          MIN_CLIENT_WALLETS: '0'
          MIN_OPERATOR_EARNINGS: '0'
        run: |
          mkdir -p .verification
          dump() { docker exec "${{ job.services.postgres.id }}" pg_dump -U postgres -d nightpay -Fc "$@"; }
          dump > .verification/restore.dump
          bash scripts/restore-check.sh .verification/restore.dump
          dump --section=pre-data --section=data > .verification/restore-partial.dump
          if bash scripts/restore-check.sh .verification/restore-partial.dump > .verification/restore-partial.log 2>&1; then
            cat .verification/restore-partial.log
            echo "::error::una copia sin índices ni restricciones (post-data) fue aceptada"
            exit 1
          fi
          cat .verification/restore-partial.log
          grep -q 'faltan columnas, restricciones' .verification/restore-partial.log || {
            echo "::error::la copia incompleta falló, pero no por faltarle el post-data"
            exit 1
          }

  # Navegador de verdad contra servicios aislados: Postgres y Redis propios
  # del job, una base nightpay_e2e con rol sin superusuario y migrada como al
  # arrancar el API, datos de prueba que se niegan a tocar otra base, el API y
  # las webs levantados por Playwright (playwright.ci.config.ts). Sin JWT
  # fabricados ni refrescos simulados: login y cookie reales.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://np_app:np_app@127.0.0.1:5432/nightpay_e2e
      REDIS_URL: redis://127.0.0.1:6379
      E2E_ISOLATED: '1'
      # Solo para esta prueba (no son secretos reales).
      JWT_SECRET: isolated-e2e-jwt-secret-at-least-32-characters
      COOKIE_SECRET: isolated-e2e-cookie-secret-at-least-32-characters
      ENCRYPTION_KEK: Y2ktdW5hLWNsYXZlLWRlLTMyLWJ5dGVzLXBhcmEtcHJ1ZWJh
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: nightpay/.nvmrc
          cache: pnpm
          cache-dependency-path: nightpay/pnpm-lock.yaml
      - name: Dependencias y navegador
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @nightpay/db exec prisma generate
          pnpm --filter @nightpay/e2e exec playwright install --with-deps chromium
      - name: Base exclusiva de navegador, sin superusuario
        run: |
          psql() { docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U postgres -d postgres "$@"; }
          psql -c "CREATE ROLE np_app LOGIN PASSWORD 'np_app' NOSUPERUSER NOCREATEDB NOCREATEROLE"
          psql -c "CREATE DATABASE nightpay_e2e OWNER np_app"
      - name: Migraciones como en el arranque del API (db-heal → migrate deploy → db-heal)
        working-directory: nightpay/packages/db
        run: |
          ./node_modules/.bin/tsx scripts/db-heal.ts
          ./node_modules/.bin/prisma migrate deploy
          ./node_modules/.bin/tsx scripts/db-heal.ts
      - name: Datos de prueba (el guion se niega fuera de una base local nightpay_e2e)
        run: pnpm --filter @nightpay/api exec node --import tsx ../e2e/fixtures/ci-seed.mjs
      - name: Login real, carta, total y privacidad Wallet
        run: pnpm --filter @nightpay/e2e exec playwright test --config playwright.ci.config.ts
      - name: Trazas y capturas del navegador
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: navegador-e2e
          path: |
            nightpay/apps/e2e/playwright-report/
            nightpay/apps/e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore

  # Las imágenes que despliega Dokploy: se construyen y se arrancan de verdad
  # (sin root), el API contra un Postgres y un Redis reales. Si una no arranca,
  # se ve aquí y no al pulsar Deploy.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: np
          POSTGRES_PASSWORD: np
          POSTGRES_DB: nightpay
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U np"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Antes de construir (un minuto, no cuarenta): las reglas cargan y cada
      # alerta de colas y descuentos dispara, no se repite por réplica y se
      # resuelve con las series de docs/observability/alerts.test.yml.
      - name: Reglas y escenarios de alertas Prometheus (promtool)
        run: |
          promtool() { docker run --rm --entrypoint /bin/promtool -v "$PWD/docs/observability:/rules:ro" -w /rules prom/prometheus:v2.55.1 "$@"; }
          promtool check rules alerts.yml
          promtool test rules alerts.test.yml
      - name: Construir las 5 imágenes
        run: |
          for app in api admin operator tpv web-client; do
            echo "::group::$app"
            docker build -f apps/$app/Dockerfile \
              --build-arg GIT_SHA=${{ github.sha }} \
              --build-arg BUILD_MARKER=ci-${{ github.run_number }} \
              -t np-$app . || exit 1
            echo "::endgroup::"
          done
      - name: Las webs arrancan sin root y responden
        run: |
          port=5100
          for app in admin operator tpv web-client; do
            port=$((port + 1))
            docker run -d --name np-$app -e PORT=3000 -p $port:3000 np-$app
            uid=$(docker exec np-$app id -u)
            [ "$uid" != "0" ] || { echo "::error::$app corre como root"; exit 1; }
            code=000
            for t in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:$port/ || true)
              [ "$code" != "000" ] && break
              sleep 2
            done
            echo "$app (uid $uid) → HTTP $code"
            if [ "$code" = "000" ] || [ "$code" -ge 500 ]; then docker logs np-$app; exit 1; fi
          done
      - name: El API arranca sin root, aplica migraciones y responde
        run: |
          docker run -d --name np-api --network host \
            -e DATABASE_URL=postgresql://np:np@127.0.0.1:5432/nightpay \
            -e REDIS_URL=redis://127.0.0.1:6379 \
            -e JWT_SECRET=ci-jwt-secret-solo-para-la-prueba-0123456789 \
            -e COOKIE_SECRET=ci-cookie-secret-solo-para-la-prueba-012345 \
            -e ENCRYPTION_KEK=Y2ktdW5hLWNsYXZlLWRlLTMyLWJ5dGVzLXBhcmEtcHJ1ZWJh \
            -e ORIGIN_AUTH_SECRET=ci-origin-auth-solo-para-la-prueba-0123 \
            -e METRICS_TOKEN=ci-metrics-token-solo-para-la-prueba-0123 \
            -e PEANPE_API_URL=https://peanpe.invalid/api \
            -e PEANPE_WEBHOOK_SECRET=ci-peanpe-secret \
            -e NEXT_PUBLIC_API_URL=https://api.ci.invalid \
            -e CORS_ORIGINS=https://admin.ci.invalid \
            np-api
          uid=$(docker exec np-api id -u)
          [ "$uid" != "0" ] || { echo "::error::el API corre como root"; exit 1; }
          for t in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:4100/v1/health/live && break
            sleep 3
          done
          live=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4100/v1/health/live || true)
          full=$(curl -s -w ' %{http_code}' http://127.0.0.1:4100/v1/health || true)
          echo "API (uid $uid): /live → $live · /health → $full"
          if [ "$live" != "200" ] || [ "${full##* }" != "200" ]; then docker logs np-api; exit 1; fi
          pid1=$(docker exec np-api cat /proc/1/comm)
          echo "PID 1 del API: $pid1"
          [ "$pid1" = "node" ] || { echo "::error::el PID 1 del API es $pid1, no node (no le llegaría el SIGTERM)"; exit 1; }
      - name: El API se para limpio con SIGTERM
        run: |
          start=$(date +%s)
          docker stop -t 30 np-api
          code=$(docker inspect -f '{{.State.ExitCode}}' np-api)
          echo "docker stop: $(( $(date +%s) - start )) s, código de salida $code"
          docker logs np-api 2>&1 | tail -15
          # 137 = Docker tuvo que matarlo (SIGKILL): no atendió el SIGTERM.
          [ "$code" != "137" ] || { echo "::error::el API no se paró con SIGTERM"; exit 1; }
      - name: Registros si algo falló
        if: failure()
        run: for c in np-api np-admin np-operator np-tpv np-web-client; do echo "::group::$c"; docker logs $c 2>&1 | tail -80 || true; echo "::endgroup::"; done
