# Compila la app OxioPay del datáfono PAX (nightpay/apps/pax-android).
# Resultado: un APK de prueba en "Artifacts" de la ejecución.
# Dominio de la pantalla: variable del repositorio PAX_URL (vacía = el de siempre).
name: pax-android

on:
  workflow_dispatch:
  push:
    paths:
      - 'nightpay/apps/pax-android/**'
      - '.github/workflows/pax-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nightpay/apps/pax-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # Por defecto pide el paquete "tools", que Google ya retiró del SDK
          # (falla con "Failed to find package 'tools'"): solo lo que usa la app.
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar APK de prueba
        run: gradle assembleDebug --no-daemon -PpaxUrl="${{ vars.PAX_URL }}"
      - uses: actions/upload-artifact@v4
        with:
          name: oxiopay-pax-debug
          path: nightpay/apps/pax-android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
