# Compila la app OxioPay del datáfono PAX (nightpay/apps/pax-android).
# Resultado en "Artifacts" de la ejecución:
#   - siempre, el APK de prueba (debug);
#   - si están los secretos de firma y es main o una etiqueta, además el APK
#     de producción FIRMADO (release), el que se manda a Paytef para PAXSTORE.
#     Una rama sin revisar nunca saca un APK firmado (ni con el versionCode
#     más alto).
# versionCode = nº de ejecución del workflow: cada APK sube de versión.
# Dominio de la pantalla: variable del repositorio PAX_URL (vacía = el de siempre).
#
# Secretos de firma (GitHub → Settings → Secrets and variables → Actions):
#   PAX_KEYSTORE_BASE64    el almacén .jks en base64 (base64 -w0 pax.jks)
#   PAX_KEYSTORE_PASSWORD  contraseña del almacén
#   PAX_KEY_ALIAS          alias de la clave
#   PAX_KEY_PASSWORD       contraseña de la clave
name: pax-android

on:
  workflow_dispatch:
  push:
    paths:
      - 'nightpay/apps/pax-android/**'
      - '.github/workflows/pax-android.yml'

permissions:
  contents: read

concurrency:
  group: pax-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: nightpay/apps/pax-android
    env:
      PAX_URL: ${{ vars.PAX_URL }}
      VERSION_CODE: ${{ github.run_number }}
      # Firmar solo desde main o una etiqueta (refs/tags/…), y con los secretos puestos.
      SIGN_RELEASE: ${{ secrets.PAX_KEYSTORE_BASE64 != '' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # Por defecto pide el paquete "tools", que Google ya retiró del SDK
          # (falla con "Failed to find package 'tools'"): solo lo que usa la app.
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      # Sin Gradle wrapper en el repo (hace falta Gradle para generarlo): versión fija aquí.
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '8.7'
      - name: APK de prueba (debug)
        run: gradle assembleDebug --no-daemon -PpaxUrl="$PAX_URL" -PversionCode="$VERSION_CODE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oxiopay-pax-debug-${{ github.run_number }}
          path: nightpay/apps/pax-android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
      - name: APK de producción firmado (release)
        if: env.SIGN_RELEASE == 'true'
        env:
          PAX_KEYSTORE_BASE64: ${{ secrets.PAX_KEYSTORE_BASE64 }}
          PAX_KEYSTORE_PASSWORD: ${{ secrets.PAX_KEYSTORE_PASSWORD }}
          PAX_KEY_ALIAS: ${{ secrets.PAX_KEY_ALIAS }}
          PAX_KEY_PASSWORD: ${{ secrets.PAX_KEY_PASSWORD }}
        run: |
          export PAX_KEYSTORE_FILE="$RUNNER_TEMP/pax-release.jks"
          printf '%s' "$PAX_KEYSTORE_BASE64" | base64 -d > "$PAX_KEYSTORE_FILE"
          trap 'rm -f "$PAX_KEYSTORE_FILE"' EXIT
          gradle assembleRelease --no-daemon -PpaxUrl="$PAX_URL" -PversionCode="$VERSION_CODE"
          # Que de verdad salió firmado (si no, apksigner falla).
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/*.apk | head -3
      - if: env.SIGN_RELEASE == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oxiopay-pax-release-${{ github.run_number }}
          path: nightpay/apps/pax-android/app/build/outputs/apk/release/*.apk
          retention-days: 90
