<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cobrar - PeanPe</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #0f172a;
  color: #e2e8f0;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  -webkit-tap-highlight-color: transparent;
}

/* ── Pantalla 1: Formulario de importe ── */
#pantalla-importe {
  width: 100%;
  max-width: 400px;
  text-align: center;
}

.logo-area {
  margin-bottom: 32px;
}
.logo-area .titulo {
  font-size: 1.1rem;
  color: #94a3b8;
  font-weight: 500;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.logo-area .subtitulo {
  font-size: 0.85rem;
  color: #475569;
  margin-top: 4px;
}

.importe-wrapper {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 32px;
}
.euro-sym {
  font-size: 3.5rem;
  font-weight: 700;
  color: #3b82f6;
  line-height: 1;
}
#importe-input {
  background: transparent;
  border: none;
  outline: none;
  font-size: 5rem;
  font-weight: 800;
  color: #f1f5f9;
  width: 220px;
  text-align: left;
  caret-color: #3b82f6;
  -moz-appearance: textfield;
}
#importe-input::-webkit-outer-spin-button,
#importe-input::-webkit-inner-spin-button { -webkit-appearance: none; }
#importe-input::placeholder { color: #334155; }

.divider {
  width: 100%;
  height: 1px;
  background: #1e293b;
  margin-bottom: 32px;
}

#btn-cobrar {
  width: 100%;
  padding: 20px;
  font-size: 1.2rem;
  font-weight: 700;
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  color: white;
  border: none;
  border-radius: 16px;
  cursor: pointer;
  transition: all 0.15s ease;
  box-shadow: 0 4px 24px rgba(37, 99, 235, 0.4);
  letter-spacing: 0.3px;
}
#btn-cobrar:active { transform: scale(0.97); }
#btn-cobrar:disabled {
  background: #1e293b;
  color: #475569;
  box-shadow: none;
  cursor: not-allowed;
}

/* ── Pantalla 2: QR de pago ── */
#pantalla-qr {
  display: none;
  width: 100%;
  max-width: 420px;
  text-align: center;
}

.importe-badge {
  display: inline-block;
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 12px;
  padding: 10px 24px;
  font-size: 2rem;
  font-weight: 800;
  color: #3b82f6;
  margin-bottom: 24px;
}

.qr-container {
  background: white;
  border-radius: 20px;
  padding: 20px;
  display: inline-block;
  margin-bottom: 24px;
  box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
}
#qr-img {
  width: 280px;
  height: 280px;
  display: block;
}

.estado-texto {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  color: #94a3b8;
  font-size: 1rem;
  margin-bottom: 16px;
}

.spinner {
  width: 20px;
  height: 20px;
  border: 3px solid #1e293b;
  border-top-color: #3b82f6;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.timer {
  font-size: 0.85rem;
  color: #475569;
  margin-bottom: 20px;
}

.link-pago {
  font-size: 0.75rem;
  color: #475569;
  word-break: break-all;
  margin-bottom: 24px;
  padding: 8px 12px;
  background: #0f172a;
  border: 1px solid #1e293b;
  border-radius: 8px;
  cursor: pointer;
  transition: color 0.2s;
}
.link-pago:hover { color: #94a3b8; }

#btn-cancelar {
  background: transparent;
  border: 1px solid #334155;
  color: #64748b;
  padding: 12px 28px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 0.9rem;
  transition: all 0.15s;
}
#btn-cancelar:hover { border-color: #475569; color: #94a3b8; }

/* ── Pantalla 3: Pago confirmado ── */
#pantalla-ok {
  display: none;
  width: 100%;
  max-width: 400px;
  text-align: center;
}

.check-circle {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  background: linear-gradient(135deg, #16a34a, #15803d);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 28px;
  box-shadow: 0 8px 32px rgba(22, 163, 74, 0.4);
  animation: pop 0.4s ease;
}
@keyframes pop {
  from { transform: scale(0.6); opacity: 0; }
  to   { transform: scale(1);   opacity: 1; }
}
.check-circle svg { width: 56px; height: 56px; }

.ok-titulo {
  font-size: 2rem;
  font-weight: 800;
  color: #f1f5f9;
  margin-bottom: 8px;
}
.ok-subtitulo {
  font-size: 1rem;
  color: #64748b;
  margin-bottom: 32px;
}
.ok-importe {
  font-size: 3rem;
  font-weight: 900;
  color: #22c55e;
  margin-bottom: 40px;
}

#btn-nuevo {
  width: 100%;
  padding: 18px;
  font-size: 1.1rem;
  font-weight: 700;
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  color: white;
  border: none;
  border-radius: 16px;
  cursor: pointer;
  box-shadow: 0 4px 24px rgba(37, 99, 235, 0.4);
}

/* ── Pantalla error ── */
#pantalla-error {
  display: none;
  width: 100%;
  max-width: 420px;
  text-align: center;
}
.error-box {
  background: #1e0a0a;
  border: 1px solid #7f1d1d;
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 24px;
}
.error-titulo { color: #f87171; font-size: 1.2rem; font-weight: 700; margin-bottom: 12px; }
.error-msg { color: #fca5a5; font-size: 0.9rem; line-height: 1.6; }

#btn-reintentar {
  background: #1e293b;
  border: 1px solid #334155;
  color: #e2e8f0;
  padding: 14px 28px;
  border-radius: 12px;
  cursor: pointer;
  font-size: 1rem;
  font-weight: 600;
}
</style>
</head>
<body>

<!-- ══ PANTALLA 1: Introducir importe ══ -->
<div id="pantalla-importe">
  <div class="logo-area">
    <div class="titulo">Panel de Cobro</div>
    <div class="subtitulo">PeanPe Payments</div>
  </div>

  <div class="importe-wrapper">
    <span class="euro-sym">€</span>
    <input
      id="importe-input"
      type="number"
      inputmode="decimal"
      placeholder="0.00"
      min="0.01"
      step="0.01"
      autofocus
    />
  </div>

  <div class="divider"></div>

  <button id="btn-cobrar" disabled onclick="generarCobro()">
    Generar cobro
  </button>
</div>

<!-- ══ PANTALLA 2: QR esperando pago ══ -->
<div id="pantalla-qr">
  <div class="importe-badge" id="qr-importe"></div>

  <div class="qr-container">
    <img id="qr-img" src="" alt="QR de pago" />
  </div>

  <div class="estado-texto">
    <div class="spinner"></div>
    <span>Esperando pago del cliente...</span>
  </div>

  <div class="timer" id="timer-texto">0:00</div>

  <div class="link-pago" id="link-pago" onclick="copiarLink()" title="Pulsa para copiar"></div>

  <br>
  <button id="btn-cancelar" onclick="cancelar()">Cancelar</button>
</div>

<!-- ══ PANTALLA 3: Pago confirmado ══ -->
<div id="pantalla-ok">
  <div class="check-circle">
    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
  </div>
  <div class="ok-titulo">Pago recibido</div>
  <div class="ok-importe" id="ok-importe"></div>
  <div class="ok-subtitulo">El pago se ha completado correctamente</div>
  <button id="btn-nuevo" onclick="nuevo()">Nuevo cobro</button>
</div>

<!-- ══ PANTALLA DE ERROR ══ -->
<div id="pantalla-error">
  <div class="error-box">
    <div class="error-titulo">Error al generar el cobro</div>
    <div class="error-msg" id="error-msg"></div>
  </div>
  <button id="btn-reintentar" onclick="nuevo()">Volver a intentar</button>
</div>

<script>
let pagoUrl    = "";
let pagoCodigo = "";
let pagoImporte = 0;
let timerInterval = null;
let pollInterval  = null;
let segundos = 0;

const input = document.getElementById("importe-input");
const btnCobrar = document.getElementById("btn-cobrar");

input.addEventListener("input", () => {
  btnCobrar.disabled = !input.value || parseFloat(input.value) <= 0;
});

input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !btnCobrar.disabled) generarCobro();
});

function mostrar(id) {
  ["pantalla-importe","pantalla-qr","pantalla-ok","pantalla-error"].forEach(p => {
    document.getElementById(p).style.display = "none";
  });
  document.getElementById(id).style.display = "block";
}

async function generarCobro() {
  pagoImporte = parseFloat(input.value);
  if (!pagoImporte || pagoImporte <= 0) return;

  btnCobrar.disabled = true;
  btnCobrar.textContent = "Generando...";

  try {
    const resp = await fetch("/api/pago/crear", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ importe: pagoImporte })
    });
    const data = await resp.json();

    if (!data.ok) {
      mostrarError(data.error || "Error desconocido");
      return;
    }

    pagoUrl    = data.url;
    pagoCodigo = data.codigo;

    // Mostrar QR
    document.getElementById("qr-img").src = "data:image/png;base64," + data.qr;
    document.getElementById("qr-importe").textContent =
      "€ " + pagoImporte.toFixed(2).replace(".", ",");
    document.getElementById("link-pago").textContent = pagoUrl;

    mostrar("pantalla-qr");
    iniciarTimer();
    iniciarPolling();

  } catch (err) {
    mostrarError("Error de red: " + err.message);
  }
}

function iniciarTimer() {
  segundos = 0;
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    segundos++;
    const m = Math.floor(segundos / 60);
    const s = String(segundos % 60).padStart(2, "0");
    document.getElementById("timer-texto").textContent = `${m}:${s}`;
  }, 1000);
}

function iniciarPolling() {
  clearInterval(pollInterval);
  pollInterval = setInterval(async () => {
    try {
      const resp = await fetch(`/api/pago/estado?codigo=${encodeURIComponent(pagoCodigo)}`);
      const data = await resp.json();
      if (data.pagado) confirmarPago();
    } catch (_) {}
  }, 4000);
}

function confirmarPago() {
  clearInterval(timerInterval);
  clearInterval(pollInterval);
  document.getElementById("ok-importe").textContent =
    "€ " + pagoImporte.toFixed(2).replace(".", ",");
  mostrar("pantalla-ok");
}

function cancelar() {
  clearInterval(timerInterval);
  clearInterval(pollInterval);
  nuevo();
}

function nuevo() {
  pagoUrl = ""; pagoCodigo = ""; pagoImporte = 0; segundos = 0;
  input.value = "";
  btnCobrar.textContent = "Generar cobro";
  btnCobrar.disabled = true;
  mostrar("pantalla-importe");
  setTimeout(() => input.focus(), 100);
}

function copiarLink() {
  if (!pagoUrl) return;
  navigator.clipboard.writeText(pagoUrl).then(() => {
    const el = document.getElementById("link-pago");
    const orig = el.textContent;
    el.textContent = "✅ Enlace copiado";
    el.style.color = "#22c55e";
    setTimeout(() => { el.textContent = orig; el.style.color = ""; }, 2000);
  });
}

function mostrarError(msg) {
  btnCobrar.textContent = "Generar cobro";
  btnCobrar.disabled = false;
  document.getElementById("error-msg").textContent = msg;
  mostrar("pantalla-error");
}
</script>
</body>
</html>
