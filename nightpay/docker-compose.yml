# Entorno de DESARROLLO local (Postgres, Redis, correo de pruebas y los
# simuladores de pasarela). Producción no usa este fichero: va en Dokploy
# (docs/DOKPLOY-STEPS.md).
services:
  postgres:
    image: postgres:16-alpine
    container_name: nightpay_postgres
    environment:
      POSTGRES_DB: nightpay
      POSTGRES_USER: np
      POSTGRES_PASSWORD: np
    ports:
      # host 4432 -> container 5432
      - '4432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/db/prisma/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U np -d nightpay']
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 1g
    cpus: 1.0
    mem_reservation: 256m

  redis:
    image: redis:7-alpine
    container_name: nightpay_redis
    # noeviction es obligatorio para BullMQ (no debe borrar jobs).
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    ports:
      - '4379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 320m
    cpus: 0.5
    mem_reservation: 64m

  # Correo de pruebas (sustituye a MailHog, abandonado): SMTP 4525, web 4825.
  mailpit:
    image: axllent/mailpit:v1.31.6
    container_name: nightpay_mailpit
    ports:
      - '4525:1025' # SMTP
      - '4825:8025' # UI
    mem_limit: 128m
    cpus: 0.25

  mock-wipay:
    build:
      context: ./apps/mock-wipay
      dockerfile: Dockerfile
    container_name: nightpay_mock_wipay
    ports:
      - '4901:3000'
    environment:
      PORT: 3000
      WEBHOOK_TARGET: http://host.docker.internal:4100/v1/webhooks/wipay
      WEBHOOK_SECRET: dev_wipay_secret
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    mem_limit: 128m
    cpus: 0.25

  mock-peanpe:
    build:
      context: ./apps/mock-peanpe
      dockerfile: Dockerfile
    container_name: nightpay_mock_peanpe
    ports:
      - '4902:3000'
    environment:
      PORT: 3000
      # Actualizado a la ruta dedicada challenge-response (la genérica
      # /v1/webhooks/peanpe rechaza desde C1 con UnauthorizedException).
      WEBHOOK_TARGET: http://host.docker.internal:4100/v1/webhooks/peanpe/notify
      # Credenciales de test compartidas con peanpe.adapter.spec.ts para que
      # los tests E2E firmen igual que valida el adapter.
      API_KEY_HEX: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
      ACCOUNT_ID: '91816'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    mem_limit: 128m
    cpus: 0.25

volumes:
  pgdata:
  redisdata:
