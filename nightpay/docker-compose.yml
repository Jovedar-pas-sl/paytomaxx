services:
  postgres:
    image: postgres:16-alpine
    container_name: nightpay_postgres
    environment:
      POSTGRES_DB: nightpay
      POSTGRES_USER: np
      POSTGRES_PASSWORD: np
    ports:
      # host 4432 -> container 5432 (puertos 4xxx libres en este entorno)
      - '4432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/db/prisma/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U np -d nightpay']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nightpay_redis
    # noeviction es obligatorio para BullMQ (no debe borrar jobs).
    # Cache app-level usa expiraciones explicitas (TTL por key).
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    ports:
      # host 4379 -> container 6379
      - '4379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: nightpay_mailhog
    ports:
      - '4525:1025' # SMTP
      - '4825:8025' # UI

  mock-wipay:
    build:
      context: ./apps/mock-wipay
      dockerfile: Dockerfile
    container_name: nightpay_mock_wipay
    ports:
      - '4901:3000'
    environment:
      PORT: 3000
      WEBHOOK_TARGET: http://host.docker.internal:4100/v1/webhooks/wipay
      WEBHOOK_SECRET: dev_wipay_secret
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  mock-peanpe:
    build:
      context: ./apps/mock-peanpe
      dockerfile: Dockerfile
    container_name: nightpay_mock_peanpe
    ports:
      - '4902:3000'
    environment:
      PORT: 3000
      WEBHOOK_TARGET: http://host.docker.internal:4100/v1/webhooks/peanpe
      WEBHOOK_SECRET: dev_peanpe_secret
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  pgdata:
  redisdata:
