name: CI

on:
  push:
    branches: [main]
    paths: ['nightpay/**']
  pull_request:
    branches: [main]
    paths: ['nightpay/**']

defaults:
  run:
    working-directory: ./nightpay

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · Typecheck · Build · Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://np:np@localhost:5432/nightpay_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci_test_jwt_secret_32_bytes_min_ok_yes_yes
      COOKIE_SECRET: ci_test_cookie_secret_32_bytes_min_ok_ye
      ENCRYPTION_KEK: ci_test_kek_base64_placeholder_32b_xyzxyz
      WIPAY_API_URL: http://localhost:9001
      WIPAY_WEBHOOK_SECRET: ci_wipay_secret
      PEANPE_API_URL: http://localhost:9002
      PEANPE_WEBHOOK_SECRET: ci_peanpe_secret
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: np
          POSTGRES_PASSWORD: np
          POSTGRES_DB: nightpay_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: nightpay/pnpm-lock.yaml

      - name: Install deps
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "::warning::pnpm-lock.yaml missing — running initial install without frozen lockfile"
            pnpm install
          fi

      - name: Generate Prisma client
        run: pnpm --filter @nightpay/db generate

      - name: Apply DB migrations
        run: pnpm --filter @nightpay/db migrate

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Lint
        run: pnpm turbo lint

      - name: Build
        run: pnpm turbo build

      - name: Test
        run: pnpm turbo test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: nightpay/**/coverage
          if-no-files-found: ignore
