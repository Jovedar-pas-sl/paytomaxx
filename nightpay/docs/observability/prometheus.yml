global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: 'nightpay-api'
    metrics_path: '/v1/metrics'
    static_configs:
      - targets: ['host.docker.internal:4100']
        labels:
          service: 'api'
          env: 'dev'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # En prod: ['alertmanager:9093']
