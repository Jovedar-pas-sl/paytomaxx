groups:
  - name: nightpay-critical
    interval: 30s
    rules:
      - alert: APIDown
        expr: up{job="nightpay-api"} == 0
        for: 1m
        labels:
          severity: critical
          runbook: docs/runbooks/P0-api-down.md
        annotations:
          summary: "NightPay API no responde a /v1/metrics"
          description: "Sin scrape exitoso durante 1 min. Posible crash, DB caída, o port-block."

      - alert: HighErrorRate
        # Proxy global por job: FAILED / creados en la ventana; no es HTTP 5xx
        # ni una cohorte de pagos. Las etiquetas FSM (from/to) no coinciden con
        # venue/provider: sumar primero también combina réplicas del mismo job.
        expr: |
          (
            sum by (job) (rate(nightpay_payments_transitioned_total{to="FAILED"}[5m]))
              /
            sum by (job) (rate(nightpay_payments_created_total[5m])) > 0.10
          )
          and on (job)
          (sum by (job) (rate(nightpay_payments_created_total[5m])) > 0)
        for: 5m
        labels:
          severity: critical
          runbook: docs/runbooks/P0-pasarela-caida.md
        annotations:
          summary: "Más de 10% de pagos transitando a FAILED en 5 min"
          description: "Posible problema con pasarela. Revisa circuit breakers + webhooks."

      - alert: GatewayCircuitOpen
        expr: nightpay_circuit_state == 2
        for: 2m
        labels:
          severity: critical
          runbook: docs/runbooks/P0-pasarela-caida.md
        annotations:
          summary: "Circuit breaker abierto para {{ $labels.provider }}/{{ $labels.op }}"
          description: "La pasarela ha fallado repetidamente. Pagos pueden estar afectados."

  - name: nightpay-warning
    interval: 1m
    rules:
      - alert: AuthBruteForce
        expr: rate(nightpay_auth_logins_total{outcome="failed"}[5m]) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Tasa de logins fallidos > 1/s sostenida 5 min"
          description: "Posible brute-force. Verifica LockoutService + rate-limit."

      - alert: WebhookInvalidSpike
        expr: rate(nightpay_webhooks_received_total{outcome="invalid"}[5m]) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Webhooks inválidos > 0.5/s en 5 min"
          description: "Posible attacker probando firmas HMAC, o rotación de secret sin redeploy."

      - alert: QueueBacklog
        expr: nightpay_queue_depth > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Cola {{ $labels.queue }} > 1000 jobs por 10 min"
          description: "Workers atascados o lentos."

      - alert: EarningReversalOldest
        expr: nightpay_earning_reversal_oldest_age_seconds > 1800
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Devolución hecha sin descontar la ganancia desde hace más de 30 min"
          description: "Revisar earning_reversals; la antigüedad incluye los fallos con reintento diferido."

      - alert: EarningReversalMetricsUnavailable
        expr: nightpay_earning_reversal_metrics_up == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "No se puede consultar el backlog de descuentos por devolución"

      - alert: QueueOldestJob
        expr: nightpay_queue_oldest_age_seconds > 600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Cola {{ $labels.queue }} con trabajo listo o activo creado hace más de 10 min"
          description: "Edad desde creación en waiting/active/prioritized/paused; excluye delayed y waiting-children. No mide tiempo desde promoción o reintento."

      - alert: QueueMetricsUnavailable
        expr: nightpay_queue_metrics_up == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "No se puede consultar la cola {{ $labels.queue }}"
          description: "Redis falló o excedió 2 s; backlog y antigüedad se omiten para no mostrar datos antiguos."

      - alert: QueueFailedJobs
        expr: nightpay_queue_jobs{state="failed"} > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Cola {{ $labels.queue }} con trabajos fallidos retenidos"
          description: "Revisar el error antes de reintentar; los fallidos no se cuentan como trabajo pendiente."

      - alert: WSConnectionsAbnormal
        expr: nightpay_ws_connections_active > 500
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Conexiones WS > 500 — capacity check"
